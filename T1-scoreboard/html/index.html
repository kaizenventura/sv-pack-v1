<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TMC PVP Scoreboard</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <svg class="sprite" xmlns="http://www.w3.org/2000/svg">
        <symbol id="icon-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="M9 12l2 2 4-4"/></symbol>
        <symbol id="icon-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
        <symbol id="icon-briefcase" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><path d="M2 13h20"/></symbol>
        <symbol id="icon-book" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15Z"/></symbol>
        <symbol id="icon-scale" viewBox="0 0 24 24"><path d="M12 3v18"/><path d="M5 7h14"/><path d="M6 7l-3 7h6L6 7Z"/><path d="M18 7l-3 7h6l-3-7Z"/><path d="M8 21h8"/></symbol>
        <symbol id="icon-bullhorn" viewBox="0 0 24 24"><path d="M3 11v3a2 2 0 0 0 2 2h2l4 4v-8"/><path d="M11 12l9-5v12l-9-5"/><path d="M21 8.5a4 4 0 0 1 0 7"/></symbol>
        <symbol id="icon-signal" viewBox="0 0 24 24"><path d="M2 20h.01"/><path d="M7 20v-4"/><path d="M12 20v-8"/><path d="M17 20V8"/><path d="M22 20V4"/></symbol>
        <symbol id="icon-id" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M15 8h3"/><path d="M15 12h3"/><path d="M7 16h4"/></symbol>
        <symbol id="icon-coins" viewBox="0 0 24 24"><ellipse cx="8" cy="6" rx="6" ry="3"/><path d="M2 6v6c0 1.7 2.7 3 6 3s6-1.3 6-3V6"/><path d="M8 9c3.3 0 6-1.3 6-3"/><path d="M15 10.5c3 .2 5 1.4 5 2.9 0 1.7-2.7 3-6 3-1.2 0-2.3-.2-3.2-.5"/><path d="M20 13.5v4c0 1.7-2.7 3-6 3-3 0-5.5-1.1-5.9-2.6"/></symbol>
        <symbol id="icon-camera" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"/><circle cx="12" cy="13" r="4"/></symbol>
        <symbol id="icon-sparkles" viewBox="0 0 24 24"><path d="M12 3l1.7 5.3L19 10l-5.3 1.7L12 17l-1.7-5.3L5 10l5.3-1.7L12 3Z"/><path d="M19 15l.9 2.6L22 18.5l-2.1.9L19 22l-.9-2.6-2.1-.9 2.1-.9L19 15Z"/><path d="M5 3l.7 2L8 5.7l-2.3.7L5 9l-.7-2.6L2 5.7 4.3 5 5 3Z"/></symbol>
        <symbol id="icon-list" viewBox="0 0 24 24"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></symbol>
        <symbol id="icon-shirt" viewBox="0 0 24 24"><path d="M20.4 7.2 16 4a4 4 0 0 1-8 0L3.6 7.2a2 2 0 0 0-.5 2.5L5 13l2-1v8h10v-8l2 1 1.9-3.3a2 2 0 0 0-.5-2.5Z"/></symbol>
        <symbol id="icon-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
        <symbol id="icon-flame" viewBox="0 0 24 24"><path d="M12 22c4 0 7-2.7 7-6.5 0-2.6-1.4-4.6-3.5-6.6.1 1.9-.8 3.1-2.1 3.9.2-3-1.2-5.5-4.1-8.8.2 3.6-4.3 6.2-4.3 11.5C5 19.3 8 22 12 22Z"/></symbol>
        <symbol id="icon-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></symbol>
        <symbol id="i-code" viewBox="0 0 24 24"><path d="m18 16 4-4-4-4"/><path d="m6 8-4 4 4 4"/><path d="m14.5 4-5 16"/></symbol>
    </svg>

    <div id="app" class="hidden">
        <div class="panel">
            <header class="header">
                <div class="brand">
                    <div class="brand-icon"><svg><use href="#icon-flame"></use></svg></div>
                    <div>
                        <h1>City Scoreboard</h1>
                        <p id="pageDesc">Latest staff announcements.</p>
                    </div>
                </div>
                <div class="actions">
                    <div class="mini-stat"><svg><use href="#icon-signal"></use></svg><span id="playerOnline">0/128</span></div>
                    <div class="mini-stat"><svg><use href="#icon-id"></use></svg><span>ID <b id="playerId">0</b></span></div>
                    <button class="icon-btn" onclick="closeNui()"><svg><use href="#icon-x"></use></svg></button>
                </div>
            </header>

            <nav class="tabs">
                <button class="tab nav-btn active" data-page="announcements" data-title="Announcements" data-desc="Latest staff announcements."><svg><use href="#icon-bullhorn"></use></svg><span>Announcement</span></button>
                <button class="tab nav-btn" data-page="players" data-title="Online Players" data-desc="Players currently inside the city."><svg><use href="#icon-users"></use></svg><span>Players</span></button>
                <button class="tab nav-btn" data-page="jobs" data-title="Online Jobs" data-desc="Current job/player counts."><svg><use href="#icon-briefcase"></use></svg><span>Jobs</span><small id="jobsBadge">0</small></button>
                <button class="tab nav-btn" data-page="handbook" data-title="Handbook Newbie" data-desc="Useful commands for new players."><svg><use href="#icon-book"></use></svg><span>Handbook</span></button>
                <button class="tab nav-btn" data-page="rules" data-title="City Rules" data-desc="Please follow the server rules."><svg><use href="#icon-scale"></use></svg><span>Rules</span></button>
                <button class="tab nav-btn" data-page="exclusive" data-title="Exclusive" data-desc="Manage your exclusive features."><svg><use href="#icon-sparkles"></use></svg><span>Exclusive</span></button>
            </nav>

            <section class="content">
                <div class="content-title">
                    <div>
                        <h2 id="pageTitle">Announcements</h2>
                        <p>Select a category above</p>
                    </div>
                    <svg><use href="#icon-flame"></use></svg>
                </div>

                <div class="pages">
                    <section class="page active" id="page-announcements"><div id="announcementsList" class="announcement-list rows"></div></section>
                    <section class="page" id="page-players"><div id="playersList" class="list-grid rows"></div></section>
                    <section class="page" id="page-jobs"><div id="jobsList" class="cards-grid rows"></div></section>
                    <section class="page" id="page-handbook"><div id="commandsList" class="cards-grid rows"></div></section>
                    <section class="page" id="page-rules"><div id="rulesList" class="cards-grid rows"></div></section>
                    <section class="page" id="page-exclusive"><div id="exclusiveList" class="cards-grid exclusive-grid rows"></div></section>
                </div>
            </section>

            <footer>
                <svg class="footer-icon"><use href="#i-code"></use></svg>
                Developed by tieronesoftware.com
            </footer>
        </div>
    </div>
    <img id="logo" src="" alt="" class="hidden" />
    <script src="app.js"></script>
</body>
</html>
