<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <svg class="sprite" xmlns="http://www.w3.org/2000/svg">
        <symbol id="i-skull" viewBox="0 0 24 24"><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><path d="M8 20v2h8v-2"/><path d="m12.5 17-.5-1-.5 1h1z"/><path d="M16 20a2 2 0 0 0 1.56-3.25 8 8 0 1 0-11.12 0A2 2 0 0 0 8 20"/></symbol>
        <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></symbol>
        <symbol id="i-back" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol>
        <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></symbol>
        <symbol id="i-code" viewBox="0 0 24 24"><path d="m18 16 4-4-4-4"/><path d="m6 8-4 4 4 4"/><path d="m14.5 4-5 16"/></symbol>
    </svg>

    <main id="app" class="hidden">
        <section class="death-card">
            <header class="header">
                <div class="skull-wrap"><svg class="skull icon-stroke"><use href="#i-skull"/></svg></div>
                <h1>You Are Dead</h1>
                <p>Wait for medical assistance or respawn</p>
                <button id="minimize" class="minimize">Press G or ESC to minimize</button>
            </header>

            <div class="section-top">
                <div class="spawn-title">
                    <svg class="icon icon-stroke"><use href="#i-pin"/></svg>
                    <span>Spawn Location</span>
                </div>
                <div class="actions">
                    <button id="recap" class="disabled-action"><svg class="action-icon icon-stroke"><use href="#i-refresh"/></svg>Recap</button>
                    <button id="stuck"><svg class="action-icon icon-stroke"><use href="#i-refresh"/></svg>Stuck</button>
                </div>
            </div>

            <button id="change" class="change-btn">
                <svg class="back-icon icon-stroke"><use href="#i-back"/></svg>
                Change spawn location
            </button>

            <div id="locations" class="locations custom-scrollbar"></div>

            <button id="respawn" class="respawn disabled">Respawn in 30s</button>

            <footer>
                <svg class="footer-icon icon-stroke"><use href="#i-code"/></svg>
                Developed by tieronesoftware.com
            </footer>
        </section>
    </main>

    <div id="death-textui" class="death-textui hidden">
        <svg class="text-icon icon-stroke"><use href="#i-skull"/></svg>
        <span id="text-time">04:54</span>
        <span class="text-divider"></span>
        <span>Press <span id="text-key">G</span> to <span id="text-label">view full death screen</span></span>
    </div>

    <script src="script.js"></script>
</body>
</html>
